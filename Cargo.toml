[package]
name = "xr-system-ui"
version = "0.2.14"
edition = "2024"
license = "GPL-3.0-or-later"
description = "UKUI XR scene components and real system-service adapters"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
xr-shell-protocols = { path = "../xr-shell/protocols", version = "=0.2.0" }
xr-spatial-kit = { path = "../xr-spatial-kit", version = "0.2.6" }
